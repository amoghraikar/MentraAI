<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mentra is your personal study companion — helping you stay focused, build better habits, and reach your goals. FOCUS / LEARN / GROW">
  <meta name="theme-color" content="#173029">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mentra">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mentra — AI Study Coach</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Flutter Initialization -->
  <!-- Unregister legacy service workers, clear browser cache & purge stale tokens -->
  <script>
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var i = 0; i < keys.length; i++) {
            caches.delete(keys[i]);
          }
        });
      }
      if (window.localStorage) {
        window.localStorage.removeItem('mentra_auth_token');
        for (var j = window.localStorage.length - 1; j >= 0; j--) {
          var k = window.localStorage.key(j);
          if (k && (k.indexOf('mentra_') !== -1 || k.indexOf('FlutterSecureStorage') !== -1)) {
            window.localStorage.removeItem(k);
          }
        }
      }
    } catch (e) {}
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
