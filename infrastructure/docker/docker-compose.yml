services:
  postgres:
    image: postgres:16-alpine
    container_name: mentra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mentra}
      POSTGRES_USER: ${POSTGRES_USER:-mentra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mentra}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mentra} -d ${POSTGRES_DB:-mentra}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mentra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: mentra-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mentra}:${POSTGRES_PASSWORD:-mentra}@postgres:5432/${POSTGRES_DB:-mentra}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-mentra_production_super_secret_jwt_key_startup_2026}
      - CORS_ORIGINS=*
      - AI_PROVIDER=auto
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
